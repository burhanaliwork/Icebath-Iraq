kind = "web"
previewPath = "/"
title = "ICEBATH.IRAQ"
description = "A full-stack web application for ICEBATH.IRAQ — a React + Vite frontend backed by an Express API server and PostgreSQL database."
version = "1.0.0"
id = "artifacts/icebath-iraq"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23545

[services.development]
run = "pnpm --filter @workspace/icebath-iraq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/icebath-iraq", "run", "build" ]
serve = "static"
publicDir = "artifacts/icebath-iraq/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23545"
BASE_PATH = "/"
